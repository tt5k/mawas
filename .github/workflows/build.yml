
name: Build Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name mawas .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Force Compile SDK 36
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for file in files:
              if file.exists():
                  content = file.read_text()
                  content, count1 = re.subn(
                      r'compileSdk\s*=\s*[^\n]+',
                      'compileSdk = 36',
                      content
                  )
                  content, count2 = re.subn(
                      r'compileSdkVersion\s+[^\n]+',
                      'compileSdkVersion 36',
                      content
                  )
                  file.write_text(content)
                  print(f"Updated: {file}")
                  print(f"Changes: {count1 + count2}")
                  print(content)
          PY

      - name: Verify Android SDK
        run: |
          grep -n "compileSdk" android/app/build.gradle* 

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
