
name: Build Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name mawas .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Get packages
        run: flutter pub get

      - name: Fix Compile SDK for all plugins
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          roots = [
              Path("android"),
              Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          ]

          patterns = [
              re.compile(r'(?m)^(\s*compileSdkVersion\s+)[^\s]+'),
              re.compile(r'(?m)^(\s*compileSdk\s*=\s*)[^\s]+'),
              re.compile(r'(?m)^(\s*compileSdk\s+)[^\s]+')
          ]

          changed = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  try:
                      content = file.read_text()
                      updated = content

                      for pattern in patterns:
                          updated = pattern.sub(r'\g<1>36', updated)

                      if updated != content:
                          file.write_text(updated)
                          print("Updated:", file)
                          changed += 1
                  except (OSError, UnicodeDecodeError):
                      pass

          print("Gradle files updated:", changed)
          PY

      - name: Verify Compile SDK
        run: |
          grep -nE 'compileSdk(Version)?' android/app/build.gradle*

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
