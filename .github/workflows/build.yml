name: Build Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name mawas --overwrite .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Fix Compile SDK in app and plugins
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          def fix_gradle(file):
              content = file.read_text()
              original = content

              # Handle Gradle KTS (Kotlin DSL) syntax: compileSdk = 36
              content = re.sub(
                  r'^(\s*)compileSdk\s*=\s*.*$',
                  r'\1compileSdk = 36',
                  content,
                  flags=re.MULTILINE
              )

              # Handle Groovy / KTS space syntax: compileSdk 36 or compileSdkVersion 36
              content = re.sub(
                  r'^(\s*)compileSdk(?:Version)?\s+36\b',
                  r'\1compileSdk = 36',
                  content,
                  flags=re.MULTILINE
              )
              content = re.sub(
                  r'^(\s*)compileSdk(?:Version)?\s+[0-9]+$',
                  r'\1compileSdk = 36',
                  content,
                  flags=re.MULTILINE
              )

              if content != original:
                  file.write_text(content)
                  print("FIXED:", file)

              return True

          app_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for file in app_files:
              if file.exists():
                  fix_gradle(file)

          config = json.loads(
              Path(".dart_tool/package_config.json").read_text()
          )

          for package in config["packages"]:
              uri = urlparse(package["rootUri"])
              if uri.scheme == "file":
                root = Path(unquote(uri.path))
              else:
                root = (
                    Path(".dart_tool") / package["rootUri"]
                ).resolve()

              gradle_files = list(
                  (root / "android").glob("build.gradle*")
              )

              for file in gradle_files:
                  fix_gradle(file)

          print("Compile SDK configuration completed.")
          PY

      - name: Build Mawas APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
