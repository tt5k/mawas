name: Build Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name mawas --overwrite .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Fix Compile SDK in app and plugins
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          def fix_gradle(file):
              content = file.read_text()
              original = content

              content = re.sub(
                  r'^(\s*)compileSdkVersion\s+.*$',
                  r'\1compileSdkVersion 36',
                  content,
                  flags=re.MULTILINE
              )

              content = re.sub(
                  r'^(\s*)compileSdk\s*=\s*.*$',
                  r'\1compileSdk = 36',
                  content,
                  flags=re.MULTILINE
              )

              content = re.sub(
                  r'^(\s*)compileSdk\s+.*$',
                  r'\1compileSdk 36',
                  content,
                  flags=re.MULTILINE
              )

              if content != original:
                  file.write_text(content)
                  print("FIXED:", file)

              for line in content.splitlines():
                  if re.match(r'^\s*compileSdk(Version)?\b', line):
                      print("CHECK:", line.strip())

              return bool(re.search(
                  r'^\s*compileSdk(?:Version)?(?:\s*=|\s+)\s*36\b',
                  content,
                  flags=re.MULTILINE
              ))

          app_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_found = False
          for file in app_files:
              if file.exists():
                  app_found = fix_gradle(file)
                  break

          if not app_found:
              raise SystemExit("App compileSdk 36 was not configured")

          config = json.loads(
              Path(".dart_tool/package_config.json").read_text()
          )

          picker_found = False
          for package in config["packages"]:
              if package["name"] not in (
                  "file_picker",
                  "flutter_plugin_android_lifecycle"
              ):
                  continue

              uri = urlparse(package["rootUri"])
              if uri.scheme == "file":
                root = Path(unquote(uri.path))
              else:
                root = (
                    Path(".dart_tool") / package["rootUri"]
                ).resolve()

              gradle_files = list(
                  (root / "android").glob("build.gradle*")
              )

              if package["name"] == "file_picker":
                  picker_found = bool(gradle_files)

              for file in gradle_files:
                  if not fix_gradle(file):
                      raise SystemExit(
                          "Could not set compileSdk 36 in " + str(file)
                      )

          if not picker_found:
              raise SystemExit("file_picker Gradle file was not found")

          print("Compile SDK configuration completed.")
          PY

      - name: Build Mawas APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
