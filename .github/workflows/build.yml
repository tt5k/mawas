
name: Build Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name mawas .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Configure Compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              pattern = r'^(\s*)compileSdk\s*=.*$'
              replacement = r'\1compileSdk = 36'
          elif groovy.exists():
              path = groovy
              pattern = r'^(\s*)compileSdkVersion\s+.*$'
              replacement = r'\1compileSdkVersion 36'
          else:
              raise SystemExit("Android app Gradle file not found")

          lines = path.read_text().splitlines()
          found = False

          for i, line in enumerate(lines):
              if re.match(pattern, line):
                  lines[i] = re.sub(pattern, replacement, line)
                  found = True
                  break

          if not found:
              raise SystemExit("Could not find compileSdk setting")

          path.write_text("\n".join(lines) + "\n")
          print("Corrected:", path)
          print(lines[i])
          PY

      - name: Verify Compile SDK
        run: |
          grep -nE 'compileSdk(Version)?' android/app/build.gradle*

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
